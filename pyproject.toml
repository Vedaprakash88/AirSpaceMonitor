[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airspace_monitor"
version = "0.1.0"
description = "A modular package for monitoring airspace, downloading Flightradar24 flights and tracking carrier movements"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0.2",
    "openpyxl>=3.1.2",
    "xlsxwriter>=3.1.2",
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.1",
    "matplotlib>=3.7.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["airspace_monitor*"]
